# The CALLER workflow every connector repository runs.
#
# This copy is the SOURCE OF TRUTH. `BBTT-01/st-connector-template` and each
# contractor's repository hold near-copies of it, and those copies live in
# repositories this one cannot update — a contractor owns theirs. So the shape
# is kept here, beside the reusable workflow it calls, and it is covered by
# `tests/st_exporter/test_workflow.py`: the set of jobs, the cadences, the
# absence of any per-feed gate, and the one-drain rule are asserted on THIS file
# every time the suite runs. Change this file and the template together.
#
# It is under `docs/examples/` and not `.github/workflows/` on purpose: dropped
# into `.github/workflows/` it would run here, in the exporter's own repository,
# against no secrets at all.
#
# ===========================================================================
# WHAT A CONTRACTOR RUNS — THE SAME FILE, FOR EVERYBODY
# ===========================================================================
#
#   Feed job            Cadence     Exports for a contractor who bought
#   ------------------  ----------  -----------------------------------------
#   jobs-feed           */5         TradeRated, Profit Wizard
#   technicians-feed    */30        TradeRated, Profit Wizard
#   pricebook-feed      hourly      TrueQuote
#   financial-feed      */6 hours   Profit Wizard
#   images-feed         */2 hours   TrueQuote — see below, it is not a tab feed
#   outbox-drain        */5         everyone — see below, it is not a feed
#
# EVERY JOB RUNS ON ITS SCHEDULE, FOR EVERY CONTRACTOR. There is nothing here to
# switch on, and no repository variable decides which feeds export. What a
# contractor bought is already stated, once, in the boxes they ticked when they
# created the ServiceTitan app: the scopes on that app are what actually control
# access, and a feed they did not buy is refused by ServiceTitan with a 403.
#
# There used to be four variables (`JOBS_FEED`, `TECHNICIANS_FEED`,
# `PRICEBOOK_FEED`, `FINANCIAL_FEED`), one per feed, all off by default. They
# were a second, hand-maintained copy of a fact ServiceTitan already holds, and
# two copies of one fact drift:
#
#   * variable ON, scope MISSING  -> a red run every hour, forever.
#   * variable OFF, scope GRANTED -> a feed they paid for silently not running,
#     on green runs, which is the failure mode everything else in this file
#     exists to prevent.
#
# The exporter tells the two 403s apart from `_meta`, which records the last
# successful run of every tab (`src/st_exporter/scopes.py`):
#
#   * A TAB with NO `_meta` row ever, and no such tab in the Sheet, has never
#     been written, so the entity was never granted: it is skipped quietly,
#     writes no tab, and does not fail the run. An absent tab means "not bought".
#   * A TAB whose `_meta` row names a past run HAS worked, so a 403 now means
#     the permission was REVOKED: the run is annotated `::error`, that tab keeps
#     its last good contents, and the run goes red.
#
# Per TAB, not per feed, because ServiceTitan grants per entity. A contractor who
# bought TrueQuote but not Profit Wizard has Pricebook Services, Equipment and
# Categories ticked and NOT Materials, so `pricebook.materials` is refused on
# every run of every such tenant, forever, while the other three tabs export
# normally and the run stays green. Likewise a Profit Wizard tenant missing the
# Reporting box exports invoices, timesheets and business units and no
# `reporting.jobCosts`. One refused tab never costs its siblings.
#
# So a reviews-only contractor still exports nothing they did not buy — no
# pricebook, no invoices, no timesheets, no payroll — but that is enforced by
# ServiceTitan rather than restated here.
#
# MIGRATING A CONNECTOR THAT ALREADY HAS THEM SET: nothing to do first, and
# nothing to do in a particular order — that ordering hazard is what this change
# removes. Merging this file simply starts running every job; a job whose scope
# is missing skips quietly. The old variables are inert and can be deleted
# whenever convenient (`gh variable delete JOBS_FEED`, and so on).
#
# ===========================================================================
# THE ONE DRAIN
# ===========================================================================
#
# `outbox-drain` is not a feed. It writes no tab and fetches nothing from
# ServiceTitan's read API. It drains the outbox queue of every product whose
# machine token it is given, and it must exist EXACTLY ONCE.
#
# The previous version of this workflow relied on a COMMENT to keep the
# technicians job from draining a second time every cycle. That comment was
# deleted from a live connector repository, and the next maintainer there was
# one "fix the inconsistency" commit away from doubling the drain rate. With
# three product queues instead of one, that trap got three times worse. So the
# rule is no longer carried by a comment. Three independent things now have to
# be true at once before anything drains, and NO feed job has any of them:
#
#   1. `feeds:` must name `outbox`. The exporter drains if and only if it is
#      asked to (`cli.py`, `drain_requested`); handing it outbox secrets is
#      inert on its own. No feed job below names `outbox`.
#   2. A product's `*_MACHINE_TOKEN` must be set on the job. A lane is built
#      only when BOTH the token and the URL are non-empty, so a job holding one
#      and not the other configures no lane and drains nothing even if somebody
#      does add `outbox` to its feeds. No feed job below is given ANY machine
#      token — `pricebook-feed` gets `TRUEQUOTE_OUTBOX_URL` and the separate
#      image-upload token, and that pair cannot form a drain lane.
#   3. It has to win the lock. Every drain names the same `feeds: "outbox"`
#      string, so every drain lands in the same concurrency group in the
#      reusable workflow, and two of them can never run at once.
#
# And if somebody copies this job anyway, it is LOUD rather than silent: the
# reusable workflow prints a `::notice title=Outbox drain::` and a run summary
# on every run that drains. One per five-minute cycle is correct. Two is a
# second drainer, visible in the Actions list without reading any YAML.
#
# The drain has NO enable variable, deliberately. Every product's write path
# runs through its outbox, so every contractor needs it; and a drain that can
# be switched off by forgetting a variable is a drain that stops silently. When
# a contractor has no outbox secrets at all the run is a cheap no-op: it opens
# no Sheet and calls nothing.
#
# ===========================================================================
# THE IMAGE PASS IS ITS OWN JOB
# ===========================================================================
#
# `images-feed` writes no tab. It re-lists the pricebook from ServiceTitan and
# POSTs each item's image BYTES to TrueQuote, recording what it sent in a
# private ledger. `pricebook-feed` still exports the image IDENTIFIERS into the
# `pricebook.*` tabs; this job is what makes the pictures themselves arrive.
#
# It used to be a flag on `pricebook-feed`, inside the same ten-minute job, and
# on a tenant with thousands of images it could not finish: run 35130164187 on
# `BBTT-01/tr-doorservpro` was SIGKILLed at 10m35s having uploaded ZERO images.
# Worse, it could not converge on its own — a killed process writes no ledger,
# so the next run re-downloaded the same prefix and was killed in the same
# place, for ever — and while it failed it took the hourly pricebook export
# down with it.
#
# Three things changed, and it needs all three:
#
#   1. Its own job, so a slow image pass can no longer fail the pricebook feed.
#   2. Its own `job_timeout_minutes`, and the exporter is TOLD that number: it
#      stops the pass two minutes short of it and flushes its ledger, instead of
#      being killed mid-download with nothing written.
#   3. Its own lock. It writes no `_meta` and touches no export tab, which is
#      the reusable workflow's stated test for leaving the shared export lock —
#      the same test `outbox-drain` passes. So a two-hourly image sweep never
#      queues the */5 jobs feed behind it.
#
# A run that does not get through the whole catalogue is NORMAL and is not a
# failure: it reports `images_pending=` and the next run starts with exactly the
# images it did not reach, because the pass works least-recently-verified first.
# `images_pending` falling to 0 over a few runs is a sweep converging. If it
# never falls, raise `job_timeout_minutes` on this job — nothing else.
#
# TRUEQUOTE_IMAGE_TOKEN BELONGS TO THIS JOB AND NO OTHER. Leaving it on
# `pricebook-feed` after adopting this file uploads nothing from there (the
# exporter only builds an image client for the `images` feed) and the run says
# so at WARNING. A contractor with no TrueQuote image token at all simply does
# not add this job, or adds it and it no-ops: the identifiers still reach the
# Sheet, only the bytes are skipped.
#
# ===========================================================================
# WHY PRICEBOOK CAN STILL DELAY JOBS
# ===========================================================================
#
# The drain and the image pass each take their own lock, so neither the
# 5-minute drain nor the two-hourly image sweep queues behind an hourly
# pricebook run. The four EXPORT feed jobs still share one lock, and
# that is not an oversight: every export feed reads the whole `_meta` grid and
# writes the whole `_meta` grid back, carrying over the rows for the feeds it
# did not run. Two feeds running at once would roll each other's cursors and
# row counts back. Giving them per-feed locks today would trade a latency
# problem for a data-integrity one. Making `_meta` merge on write — so a feed
# only ever replaces its own rows — is what unlocks per-feed keys, and it is a
# change in the exporter's Python, not here.
#
# The cadences below are offset (`:07`, `03:37`) rather than landing on the
# hour, so the long feeds do not start in the same minute as a `*/5` jobs run
# and queue behind it.

name: ServiceTitan Export

on:
  schedule:
    # GitHub Actions cron has a five-minute floor and is best-effort — under
    # load these fire every ~12 minutes rather than every 5. Measured, not
    # theoretical, so nothing anywhere should promise five minutes.
    - cron: "*/5 * * * *"    # jobs-feed + outbox-drain
    - cron: "*/30 * * * *"   # technicians-feed
    - cron: "7 * * * *"      # pricebook-feed
    - cron: "37 */6 * * *"     # financial-feed
    # Offset from the hourly pricebook run rather than landing beside it: the
    # two are independent now (different locks), but a tenant reading the
    # Actions list should be able to tell them apart at a glance. Two-hourly
    # because a converged catalogue costs almost nothing to sweep and a large
    # one takes several runs to converge either way.
    - cron: "22 */2 * * *"     # images-feed
  workflow_dispatch:
    inputs:
      feed:
        description: "Which single feed to run by hand"
        type: choice
        default: jobs
        options:
          - jobs
          - technicians
          - pricebook
          - financial
          - images
          - outbox
# A manual dispatch runs ONE job, chosen above, rather than all of them. It used
# to start every job at once; they all take the same lock, and GitHub keeps only
# one queued run per group, so the surplus jobs were cancelled before running a
# step — a `cancelled` result that looked like a failure and was not.

jobs:
  # ==========================================================================
  # FEED JOBS — none of these drains. None of them is given a machine token.
  #
  # All four run for every contractor. ServiceTitan's scopes decide which of them
  # actually export: a feed the tenant's app was never granted answers 403, and
  # the exporter skips it quietly and writes no tab. See the header.
  # ==========================================================================

  jobs-feed:
    if: >-
      github.event.schedule == '*/5 * * * *' || github.event.inputs.feed == 'jobs'
    uses: BBTT-01/ST-exporter/.github/workflows/export.yml@exporter-v0.2.37
    with:
      feeds: "jobs"
    secrets:
      ST_CLIENT_ID: ${{ secrets.SERVICETITAN_CLIENT_ID }}
      ST_CLIENT_SECRET: ${{ secrets.SERVICETITAN_CLIENT_SECRET }}
      ST_APP_KEY: ${{ secrets.SERVICETITAN_APP_KEY }}
      ST_TENANT_ID: ${{ secrets.SERVICETITAN_TENANT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_WRITER_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.EXPORT_SPREADSHEET_ID }}
      GOOGLE_RAW_CACHE_SHEET_ID: ${{ secrets.GOOGLE_RAW_CACHE_SHEET_ID }}

  technicians-feed:
    if: >-
      github.event.schedule == '*/30 * * * *' || github.event.inputs.feed == 'technicians'
    uses: BBTT-01/ST-exporter/.github/workflows/export.yml@exporter-v0.2.37
    with:
      feeds: "technicians"
    secrets:
      ST_CLIENT_ID: ${{ secrets.SERVICETITAN_CLIENT_ID }}
      ST_CLIENT_SECRET: ${{ secrets.SERVICETITAN_CLIENT_SECRET }}
      ST_APP_KEY: ${{ secrets.SERVICETITAN_APP_KEY }}
      ST_TENANT_ID: ${{ secrets.SERVICETITAN_TENANT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_WRITER_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.EXPORT_SPREADSHEET_ID }}
      GOOGLE_RAW_CACHE_SHEET_ID: ${{ secrets.GOOGLE_RAW_CACHE_SHEET_ID }}

  pricebook-feed:
    if: >-
      github.event.schedule == '7 * * * *' || github.event.inputs.feed == 'pricebook'
    uses: BBTT-01/ST-exporter/.github/workflows/export.yml@exporter-v0.2.37
    with:
      feeds: "pricebook"
      # CONFIGURATION, not a gate: it narrows WHAT the pricebook feed exports,
      # it does not decide WHETHER it runs. Blank exports the whole catalogue,
      # which is what almost every tenant wants. Each id costs one extra request
      # per item resource. The feed itself is gated by nothing but ServiceTitan's
      # Pricebook scope.
      pricebook_category_ids: ${{ vars.PRICEBOOK_CATEGORY_IDS }}
    secrets:
      ST_CLIENT_ID: ${{ secrets.SERVICETITAN_CLIENT_ID }}
      ST_CLIENT_SECRET: ${{ secrets.SERVICETITAN_CLIENT_SECRET }}
      ST_APP_KEY: ${{ secrets.SERVICETITAN_APP_KEY }}
      ST_TENANT_ID: ${{ secrets.SERVICETITAN_TENANT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_WRITER_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.EXPORT_SPREADSHEET_ID }}
      GOOGLE_RAW_CACHE_SHEET_ID: ${{ secrets.GOOGLE_RAW_CACHE_SHEET_ID }}
      # NO TRUEQUOTE_IMAGE_TOKEN. The image bytes moved to `images-feed` below,
      # because downloading them could not fit in this job's ten minutes and was
      # failing the whole pricebook export every hour. This job still exports the
      # image IDENTIFIERS into the `pricebook.*` tabs — that never depended on
      # the token. Putting the token back here uploads nothing (the exporter
      # builds an image client only for the `images` feed) and the run warns.

  financial-feed:
    if: >-
      github.event.schedule == '37 */6 * * *' || github.event.inputs.feed == 'financial'
    uses: BBTT-01/ST-exporter/.github/workflows/export.yml@exporter-v0.2.37
    with:
      feeds: "financial"
    secrets:
      ST_CLIENT_ID: ${{ secrets.SERVICETITAN_CLIENT_ID }}
      ST_CLIENT_SECRET: ${{ secrets.SERVICETITAN_CLIENT_SECRET }}
      ST_APP_KEY: ${{ secrets.SERVICETITAN_APP_KEY }}
      ST_TENANT_ID: ${{ secrets.SERVICETITAN_TENANT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_WRITER_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.EXPORT_SPREADSHEET_ID }}
      GOOGLE_RAW_CACHE_SHEET_ID: ${{ secrets.GOOGLE_RAW_CACHE_SHEET_ID }}

  # ==========================================================================
  # THE IMAGE PASS — writes no tab, and the only job holding the image token.
  # Read "THE IMAGE PASS IS ITS OWN JOB" at the top before changing it.
  # ==========================================================================

  images-feed:
    if: >-
      github.event.schedule == '22 */2 * * *' || github.event.inputs.feed == 'images'
    uses: BBTT-01/ST-exporter/.github/workflows/export.yml@exporter-v0.2.37
    with:
      # `images` and nothing else. Adding an export feed here would put this job
      # back on the shared export lock and make it write `_meta`, which is the
      # entire reason it is allowed a lock of its own.
      feeds: "images"
      # The same category restriction the pricebook feed uses, so this job
      # uploads images for exactly the items that one exports. Blank (the usual
      # case) means the whole catalogue.
      pricebook_category_ids: ${{ vars.PRICEBOOK_CATEGORY_IDS }}
      # 30 rather than the default 10, and ONLY on this job — nothing else in
      # this file passes it, so every other feed keeps the old ten minutes.
      #
      # This is the one job that downloads image bytes, and a large catalogue is
      # more bytes than a 10-minute job can move. The pass stops itself two
      # minutes short of this number and flushes its ledger, so a smaller value
      # is SLOWER, not broken: each run works through the images the last one did
      # not reach. What this number buys is fewer runs to a first full sweep.
      #
      # Raise it for a tenant with thousands of images. There is no cost to the
      # other feeds: this job holds its own concurrency lock.
      job_timeout_minutes: 30
      # OPTIONAL, and left unset here on purpose: 0 (no cap) is the default.
      #
      # A cap bounds how many assets ONE run FETCHES over the network — a second
      # stopping condition beside the timeout above, bounding work rather than
      # the clock. Set a number for a BOUNDED PROVING RUN — the first run on a
      # tenant, where the question is "does a single image reach TrueQuote at
      # all", not "how fast does the catalogue converge" — e.g.
      #
      #   image_max_assets: 500
      #
      # or while an image strategy is still settling, e.g. 1000.
      #
      # Assets the pass skips for free (ServiceTitan says the item has not
      # changed since the ledger confirmed it) do not count against it, so a
      # converged catalogue still sweeps end to end. Hitting it is announced as
      # `images_stopped=per-run asset cap reached`, which is deliberately not
      # the same words as the time budget's — the two ask for different dials.
      #
      # Do not leave a cap set and forget it: the pass still converges (each run
      # starts on the assets the last one missed), but a catalogue that grows
      # faster than the cap sweeps never finishes.
      #
      # OPTIONAL, and left unset here on purpose: the defaults are right.
      #
      #   image_concurrency: 8              # how many images are in flight
      #   image_requests_per_second: 6      # the ceiling per service
      #
      # The pass fetches and uploads several images at once and downloads each
      # DISTINCT picture only once however many items share it, which is what
      # makes a first sync of a large catalogue finish at all. Raise
      # `image_concurrency` (to at most 32) only for a tenant whose first sync
      # is still not converging with a large `job_timeout_minutes`; lower
      # `image_requests_per_second` if the run starts reporting
      # `images_rate_limited=` above zero.
      #
      # THE ONE-OFF ONBOARDING BACKFILL IS THIS JOB, RUN BY HAND. There is no
      # separate script and there should not be: the ServiceTitan credentials
      # live in this repository and nowhere else. Dispatch this workflow with
      # `feed: images`, leave `image_max_assets` at 0, and raise
      # `job_timeout_minutes` (GitHub allows up to 360). The pass flushes its
      # ledger every minute, so if the job is killed the next one resumes
      # within a minute of where it stopped rather than starting again.
    secrets:
      ST_CLIENT_ID: ${{ secrets.SERVICETITAN_CLIENT_ID }}
      ST_CLIENT_SECRET: ${{ secrets.SERVICETITAN_CLIENT_SECRET }}
      ST_APP_KEY: ${{ secrets.SERVICETITAN_APP_KEY }}
      ST_TENANT_ID: ${{ secrets.SERVICETITAN_TENANT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_WRITER_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.EXPORT_SPREADSHEET_ID }}
      GOOGLE_RAW_CACHE_SHEET_ID: ${{ secrets.GOOGLE_RAW_CACHE_SHEET_ID }}
      # TrueQuote's host and an `image_upload`-scoped token. THE ONLY JOB IN
      # THIS FILE THAT GETS THE IMAGE TOKEN — it used to be on `pricebook-feed`,
      # and leaving a copy there now uploads nothing and warns. This is NOT a
      # drain lane and cannot become one: a lane needs TRUEQUOTE_MACHINE_TOKEN
      # (scope `booking_outbox`) with the URL, and that token is issued
      # separately and is given only to `outbox-drain` below.
      TRUEQUOTE_OUTBOX_URL: ${{ secrets.TRUEQUOTE_OUTBOX_URL }}
      TRUEQUOTE_IMAGE_TOKEN: ${{ secrets.TRUEQUOTE_IMAGE_TOKEN }}

  # ==========================================================================
  # THE DRAIN — the only job in this file that may name `outbox`, and the only
  # one holding a product machine token. Do not copy it. Do not add `outbox` to
  # a feed job. Read the "THE ONE DRAIN" section at the top before changing it.
  # ==========================================================================

  outbox-drain:
    if: >-
      github.event.schedule == '*/5 * * * *' || github.event.inputs.feed == 'outbox'
    uses: BBTT-01/ST-exporter/.github/workflows/export.yml@exporter-v0.2.37
    with:
      # `outbox` and nothing else. Adding an export feed here would put this job
      # back on the shared export lock and back behind the hourly pricebook run,
      # and would make it write `_meta`.
      #
      # ONE DELIBERATE EXCEPTION, and it is a trade: `feeds: "jobs,outbox"`.
      # That is the only shape in which the exporter can WRITE BACK what the
      # drain just wrote — a technician assignment pushed from Profit Wizard
      # lands in the `jobs` tab in the same run that performed it, instead of
      # waiting for the next jobs run to rediscover it (up to twelve minutes).
      # The write-back needs this run's own denormalised rows and a legitimate
      # claim on the `jobs` tab, and a drain-only run has neither, by design:
      # "makes no Export Store round-trip" is the whole justification for the
      # separate `...-outbox` concurrency lock.
      #
      # What you give up by merging them: this job joins the shared export lock,
      # so a drain can queue behind an hourly pricebook or six-hourly financial
      # run. Both jobs are already on the same */5 schedule, so merging them
      # costs one job, not one cadence. Delete `jobs-feed` above if you do it —
      # two jobs both asking for `jobs` would roll each other's cursors back.
      feeds: "outbox"
    secrets:
      ST_CLIENT_ID: ${{ secrets.SERVICETITAN_CLIENT_ID }}
      ST_CLIENT_SECRET: ${{ secrets.SERVICETITAN_CLIENT_SECRET }}
      ST_APP_KEY: ${{ secrets.SERVICETITAN_APP_KEY }}
      ST_TENANT_ID: ${{ secrets.SERVICETITAN_TENANT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_WRITER_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.EXPORT_SPREADSHEET_ID }}
      GOOGLE_RAW_CACHE_SHEET_ID: ${{ secrets.GOOGLE_RAW_CACHE_SHEET_ID }}
      # One pair per product. A pair that is not set is an empty string, which
      # builds no lane, so a contractor lists only what they bought and nothing
      # here needs to know what that was.
      #
      # The names on the LEFT belong to the reusable workflow and can only be
      # renamed by ST-exporter, in a new tag. The names on the RIGHT are this
      # repository's own secrets. `PLATFORM_*` is the reviews platform's pair,
      # named neutrally because it predates there being more than one product;
      # the two newer pairs have to name their product to stay distinguishable.
      TRADERATED_MACHINE_TOKEN: ${{ secrets.PLATFORM_MACHINE_TOKEN }}
      TRADERATED_OUTBOX_BASE_URL: ${{ secrets.PLATFORM_OUTBOX_URL }}
      TRUEQUOTE_MACHINE_TOKEN: ${{ secrets.TRUEQUOTE_MACHINE_TOKEN }}
      TRUEQUOTE_OUTBOX_URL: ${{ secrets.TRUEQUOTE_OUTBOX_URL }}
      PROFITWIZARD_MACHINE_TOKEN: ${{ secrets.PROFITWIZARD_MACHINE_TOKEN }}
      PROFITWIZARD_OUTBOX_URL: ${{ secrets.PROFITWIZARD_OUTBOX_URL }}
