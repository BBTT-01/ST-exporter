name: Export

on:
  workflow_call:
    inputs:
      feeds:
        description: >-
          Comma-separated feeds to run: jobs, technicians, pricebook, financial,
          outbox.

          `outbox` is not an export feed — it writes no tab and fetches nothing.
          It DRAINS the outbox queue of every product whose secrets this job was
          given, and it MUST appear in exactly one caller job.

          This is the structural half of the one-drain rule. Before it, the
          exporter drained on any invocation whose outbox secrets happened to be
          set, and the only thing stopping a second job from draining the same
          queue again was a comment in the caller workflow — a comment that was
          already stripped from one live connector repo. Now the secrets alone
          do nothing: a job that does not ask for `outbox` cannot drain, however
          many secrets it is handed.
        type: string
        default: "jobs,technicians"
      window:
        description: "Job window in days (appointment_start within last N days or future)"
        type: number
        default: 90
      target:
        description: "Export target; only 'sheets' is supported today"
        type: string
        default: "sheets"
      financial_window:
        description: >-
          Financial window in days for the `financial` feed (invoices, timesheets
          and the Job Costing Summary report). Separate from `window` on purpose:
          the two share the number 90 but not the reason. 90 is the shortest
          window covering every Profit Wizard surface fed from ServiceTitan; raise
          it to 365 only for a tenant that uses the reports page's "Last year".
        type: number
        default: 90
      financial_max_jobs:
        description: >-
          Cap on how many completed jobs the `financial` feed pulls timesheets for.
          ServiceTitan has no bulk endpoint carrying the timesheet fields Profit
          Wizard reads, so this costs one request per job.
        type: number
        default: 500
      pricebook_category_ids:
        description: >-
          Optional comma-separated ServiceTitan pricebook category ids to restrict
          the pricebook feed to. Blank exports the whole catalogue. Each id costs
          one extra request per item resource (ServiceTitan honours one id per
          request), so leave it blank unless a tenant really needs it.
        type: string
        default: ""
    secrets:
      ST_CLIENT_ID:
        required: true
      ST_CLIENT_SECRET:
        required: true
      ST_APP_KEY:
        required: true
      ST_TENANT_ID:
        required: true
      GOOGLE_SERVICE_ACCOUNT_JSON:
        required: true
      GOOGLE_SHEET_ID:
        required: true
      GOOGLE_RAW_CACHE_SHEET_ID:
        required: true
      # ---------------------------------------------------------------------
      # OUTBOX LANES — one pair of secrets per product the contractor bought.
      # A lane runs only when BOTH of its values are non-empty, so an unbought
      # product is simply absent. All optional: `required: false` is what lets
      # a caller omit the ones it did not buy.
      #
      # Handing these to a second job is now INERT rather than harmful: the
      # drain is gated on `feeds: outbox`, not on the secrets being present.
      # ---------------------------------------------------------------------
      TRADERATED_MACHINE_TOKEN:
        required: false
      TRADERATED_OUTBOX_BASE_URL:
        required: false
      TRUEQUOTE_MACHINE_TOKEN:
        required: false
      TRUEQUOTE_OUTBOX_URL:
        required: false
      PROFITWIZARD_MACHINE_TOKEN:
        required: false
      PROFITWIZARD_OUTBOX_URL:
        required: false
      # A SEPARATE machine token, scope `image_upload`, issued from the same
      # TrueQuote panel as TRUEQUOTE_MACHINE_TOKEN (scope `booking_outbox`).
      # Every app rejects a token presented to the wrong scope with a flat 401,
      # and the three apps do not even share a scope vocabulary
      # (`crm_outbox` / `booking_outbox` + `image_upload` / `servicetitan_outbox`),
      # so no token is ever interchangeable with another. Absent = pricebook
      # image bytes are simply not uploaded; the `image_refs` identifiers still
      # go to the Sheet.
      #
      # TRADERATED_IMAGE_TOKEN is the ORIGINAL name for this same TrueQuote
      # token and is still accepted — a connector pinned in a contractor's own
      # repository cannot be updated on our schedule, so names widen.
      TRUEQUOTE_IMAGE_TOKEN:
        required: false
      TRADERATED_IMAGE_TOKEN:
        required: false

jobs:
  export:
    runs-on: ubuntu-latest
    if: ${{ inputs.target == 'sheets' }}
    # The jobs feed runs every 5 minutes and technicians every 30, and a large
    # tenant's first full drain can exceed 5 minutes — so runs really can
    # overlap. They write the same `_meta` grid and the same `_outbox_ledger`
    # tab (one tab shared by all three products' lanes), each via
    # read-then-full-replace, so an overlapping run can read stale state and
    # silently roll back the other's cursor/ledger writes. Serialize instead.
    # `github.repository` is the CALLING repo, so each customer gets their own
    # group: a customer never collides with themselves, and different customers
    # never block each other.
    #
    # This group spans EVERY caller job, because every one of them calls this
    # same reusable workflow. That is the second guarantee behind the one-drain
    # rule: even if somebody did add `feeds: outbox` to a second job, the two
    # drains could never run at the same time and could never interleave their
    # ledger writes — the damage would be a doubled drain RATE, not a corrupted
    # ledger or a duplicated ServiceTitan write (every app's claim is
    # skip-locked, so two drainers never receive the same row).
    # cancel-in-progress: false — killing a run mid-drain is exactly the
    # crash the ledger has to recover from; better to just queue.
    concurrency:
      group: st-export-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # ---------------------------------------------------------------------
      # THE ONE VERSION LITERAL IN THIS FILE.
      # Bump it and pyproject.toml together via `scripts/release.sh <version>`,
      # in the same commit the new tag is cut from. Everything else — the
      # checkout ref and the expected version the guard asserts — is derived
      # from this string.
      # ---------------------------------------------------------------------
      EXPORTER_TAG: exporter-v0.2.8
    steps:
      # A reusable (workflow_call) workflow runs in the CALLER's context, so a
      # bare checkout would fetch the caller's repo (which has no pyproject.toml)
      # and `pip install -e .` would fail. This repo and ref are pinned explicitly.
      #
      # `EXPORTER_TAG` (job env, top of this job) is the ONE version literal in
      # this file. The checkout ref and the expected version are both derived from
      # it, so they cannot disagree with each other — only with the code, which is
      # exactly what the guard below is for.
      #
      # It is a literal, and for now it has to be. There is no PROVEN GitHub
      # context naming a called reusable workflow's own ref: `github.ref`,
      # `github.sha` and `GITHUB_WORKFLOW_REF` all describe the CALLER. Deriving it
      # from GITHUB_WORKFLOW_REF was tried on 2026-09-08 and resolved to
      # `refs/heads/main` — the connector repo's branch — silently checking out
      # this repo's `main`. `github.job_workflow_ref` is documented to name the
      # reusable workflow itself and was NOT the field tried then; the diagnostic
      # step below records what it actually resolves to on a real customer run, so
      # the last literal can be removed on evidence rather than on the docs.
      #
      # Until then: `scripts/release.sh <version>` bumps this and pyproject.toml
      # together. Do not hand-edit one of them.
      #
      # The guard exists because the bump was missed once and the failure was
      # invisible — v0.2.1 was cut, the caller repointed, and the run logged
      # `Uses: ...@exporter-v0.2.1` while `HEAD is now at c96d08a` named v0.2.0's
      # commit. The wrong code ran successfully.
      - name: Record what job_workflow_ref resolves to (diagnostic only)
        run: |
          echo "github.job_workflow_ref = ${{ github.job_workflow_ref }}"
          echo "github.workflow_ref     = ${{ github.workflow_ref }}"
          echo "(nothing depends on these yet — see the comment above)"

      - uses: actions/checkout@v4
        with:
          repository: BBTT-01/ST-exporter
          ref: ${{ env.EXPORTER_TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      # The pinned tag above and the code it fetches can drift, and when they do
      # nothing errors — the wrong exporter just runs. This turns that into a hard
      # failure: EXPORTER_VERSION is bumped in the same commit a tag is cut from,
      # so a mismatch means `ref:` points somewhere other than this file's own tag.
      # It is also the version stamped into the Export Store's `_meta` tab, so the
      # Sheet itself records which exporter wrote it.
      - name: Verify the checked-out exporter matches the pinned tag
        run: |
          # Derived from the single literal, not typed a second time.
          EXPECTED_EXPORTER_VERSION="${EXPORTER_TAG#exporter-v}"
          if [ "$EXPECTED_EXPORTER_VERSION" = "$EXPORTER_TAG" ]; then
            echo "::error::EXPORTER_TAG ('$EXPORTER_TAG') is not of the form" \
                 "exporter-vX.Y.Z, so the expected version cannot be derived."
            exit 1
          fi
          actual="$(python -c 'from st_exporter import EXPORTER_VERSION; print(EXPORTER_VERSION)')"
          if [ "$actual" != "$EXPECTED_EXPORTER_VERSION" ]; then
            echo "::error::exporter version mismatch — this workflow expects" \
                 "$EXPECTED_EXPORTER_VERSION but the checked-out code is $actual." \
                 "The 'ref:' in the checkout step is pointing at the wrong commit."
            exit 1
          fi
          echo "exporter $actual matches the pinned tag"

      - name: Run export
        env:
          ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID }}
          ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET }}
          ST_APP_KEY: ${{ secrets.ST_APP_KEY }}
          ST_TENANT_ID: ${{ secrets.ST_TENANT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_RAW_CACHE_SHEET_ID: ${{ secrets.GOOGLE_RAW_CACHE_SHEET_ID }}
          EXPORTER_WINDOW_DAYS: ${{ inputs.window }}
          TRADERATED_MACHINE_TOKEN: ${{ secrets.TRADERATED_MACHINE_TOKEN }}
          TRADERATED_OUTBOX_BASE_URL: ${{ secrets.TRADERATED_OUTBOX_BASE_URL }}
          TRUEQUOTE_MACHINE_TOKEN: ${{ secrets.TRUEQUOTE_MACHINE_TOKEN }}
          TRUEQUOTE_OUTBOX_URL: ${{ secrets.TRUEQUOTE_OUTBOX_URL }}
          PROFITWIZARD_MACHINE_TOKEN: ${{ secrets.PROFITWIZARD_MACHINE_TOKEN }}
          PROFITWIZARD_OUTBOX_URL: ${{ secrets.PROFITWIZARD_OUTBOX_URL }}
          TRUEQUOTE_IMAGE_TOKEN: ${{ secrets.TRUEQUOTE_IMAGE_TOKEN }}
          TRADERATED_IMAGE_TOKEN: ${{ secrets.TRADERATED_IMAGE_TOKEN }}
          EXPORTER_PRICEBOOK_CATEGORY_IDS: ${{ inputs.pricebook_category_ids }}
          EXPORTER_FINANCIAL_WINDOW_DAYS: ${{ inputs.financial_window }}
          EXPORTER_FINANCIAL_MAX_JOBS: ${{ inputs.financial_max_jobs }}
          FEEDS: ${{ inputs.feeds }}
        run: |
          # Per-segment check rather than an enumeration of every combination —
          # `st-export` validates the same set again (parse_feeds), this is just
          # the earlier, clearer failure.
          IFS=',' read -ra FEED_PARTS <<< "$FEEDS"
          for feed in "${FEED_PARTS[@]}"; do
            case "$(echo "$feed" | tr -d '[:space:]')" in
              jobs|technicians|pricebook|financial|outbox) ;;
              *) echo "::error::invalid feeds input: $FEEDS" >&2; exit 1 ;;
            esac
          done
          st-export --feeds "$FEEDS"
