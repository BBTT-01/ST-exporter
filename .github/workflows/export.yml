name: Export

on:
  workflow_call:
    inputs:
      feeds:
        description: "Comma-separated feeds to run: jobs, technicians, or both"
        type: string
        default: "jobs,technicians"
      window:
        description: "Job window in days (appointment_start within last N days or future)"
        type: number
        default: 90
      target:
        description: "Export target; only 'sheets' is supported today"
        type: string
        default: "sheets"
      pricebook:
        description: "Reserved; has no effect (the CLI has no price-book commands)"
        type: boolean
        default: false
    secrets:
      ST_CLIENT_ID:
        required: true
      ST_CLIENT_SECRET:
        required: true
      ST_APP_KEY:
        required: true
      ST_TENANT_ID:
        required: true
      GOOGLE_SERVICE_ACCOUNT_JSON:
        required: true
      GOOGLE_SHEET_ID:
        required: true
      GOOGLE_RAW_CACHE_SHEET_ID:
        required: true
      TRADERATED_MACHINE_TOKEN:
        required: false
      TRADERATED_OUTBOX_BASE_URL:
        required: false

jobs:
  export:
    runs-on: ubuntu-latest
    if: ${{ inputs.target == 'sheets' }}
    # The jobs feed runs every 5 minutes and technicians every 30, and a large
    # tenant's first full drain can exceed 5 minutes — so runs really can
    # overlap. Both write the same `_meta` grid and may drain the same
    # `_outbox_ledger` tab, each via read-then-full-replace, so an overlapping
    # run can read stale state and silently roll back the other's cursor/ledger
    # writes. Serialize instead. `github.repository` is the CALLING repo, so
    # each customer gets their own group: a customer never collides with
    # themselves, and different customers never block each other.
    # cancel-in-progress: false — killing a run mid-drain is exactly the
    # crash the ledger has to recover from; better to just queue.
    concurrency:
      group: st-export-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # A reusable (workflow_call) workflow runs in the CALLER's context, so a
      # bare checkout would fetch the caller's repo (which has no pyproject.toml)
      # and `pip install -e .` would fail. This repo is pinned explicitly.
      #
      # The REF is DERIVED, not hardcoded. It used to read `ref: exporter-v0.2.0`,
      # with a comment instructing whoever cut a tag to bump it in the same commit.
      # On 2026-09-08 that instruction was missed and the failure was invisible:
      # exporter-v0.2.1 was cut, the caller repointed, and the run logs read
      #
      #     Uses: .../export.yml@refs/tags/exporter-v0.2.1
      #     HEAD is now at c96d08a   <- v0.2.0's commit
      #
      # so the new workflow FILE ran while checking out the OLD code. A fix that
      # was tagged, pinned and deployed had no effect, and every surface said it
      # had. Nothing failed; the wrong code simply ran.
      #
      # GITHUB_WORKFLOW_REF is `owner/repo/path/to/workflow.yml@<ref>`, so the text
      # after the last `@` is exactly the ref this file was published under. File
      # and code can no longer disagree, and cutting a version is now a caller-side
      # change only. Note `github.ref` would NOT work here — in a reusable workflow
      # it names the CALLER's ref (`refs/heads/main` of the connector repo), which
      # does not exist in this repository.
      - name: Resolve this workflow's own ref
        id: srcref
        run: echo "ref=${GITHUB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: BBTT-01/ST-exporter
          ref: ${{ steps.srcref.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Run export
        env:
          ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID }}
          ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET }}
          ST_APP_KEY: ${{ secrets.ST_APP_KEY }}
          ST_TENANT_ID: ${{ secrets.ST_TENANT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_RAW_CACHE_SHEET_ID: ${{ secrets.GOOGLE_RAW_CACHE_SHEET_ID }}
          EXPORTER_WINDOW_DAYS: ${{ inputs.window }}
          TRADERATED_MACHINE_TOKEN: ${{ secrets.TRADERATED_MACHINE_TOKEN }}
          TRADERATED_OUTBOX_BASE_URL: ${{ secrets.TRADERATED_OUTBOX_BASE_URL }}
          FEEDS: ${{ inputs.feeds }}
          PRICEBOOK_FLAG: ${{ inputs.pricebook && '--pricebook' || '' }}
        run: |
          case "$FEEDS" in
            jobs|technicians|jobs,technicians) ;;
            *) echo "::error::invalid feeds input: $FEEDS" >&2; exit 1 ;;
          esac
          st-export --feeds "$FEEDS" $PRICEBOOK_FLAG
