[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "st-cli"
version = "0.2.18"
description = "CLI tool for the ServiceTitan REST API v2"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastmcp>=2.0.0",
    "gspread>=6.0",
    "google-auth>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "time-machine>=2.13",
    # Imported directly by the test suite, not by src/. Both arrive transitively
    # today (pyyaml via fastmcp, cryptography via google-auth), so a fresh venv
    # passes without them — until a dependency bump drops one and the guards that
    # depend on them stop being red or green and start being a COLLECTION ERROR:
    # tests/st_exporter/test_workflow.py parses .github/workflows/*.yml with
    # `yaml`, and test_sheets.py builds a service-account key with `cryptography`.
    # A guard that disappears is worse than one that fails.
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.scripts]
st = "st_cli.main:cli"
st-mcp = "st_cli.mcp_server:main"
st-export = "st_exporter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/st_cli", "src/st_exporter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Mocked classes are conventionally PascalCase (MockLazy, MockTM).
"tests/**" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
